spring.application.name=auto-ats
# Optional local secrets file (DB_PASSWORD, GEMINI_API_KEY). It is git-ignored.
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT signing key (HS256 needs at least 32 bytes). Override with the JWT_SECRET env var outside dev.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}

# Session lifetime in minutes
jwt.expiration-minutes=120

# AI provider. The key comes from the GEMINI_API_KEY environment variable, never from code.
llm.provider=gemini
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=gemini-3.5-flash
llm.gemini.base-url=https://generativelanguage.googleapis.com
llm.gemini.timeout-seconds=120
llm.gemini.max-retries=2
llm.gemini.retry-delay-millis=4000
llm.gemini.fallback-models=gemini-3.1-flash-lite,gemini-flash-lite-latest
