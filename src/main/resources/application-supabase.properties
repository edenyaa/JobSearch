# Supabase Postgres (Session pooler, port 5432). Activate with the profile "supabase".
# The password is read from DB_PASSWORD (environment variable or the git-ignored .env file) and is never written here.
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.eykcaimuhvfzathdopod
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
